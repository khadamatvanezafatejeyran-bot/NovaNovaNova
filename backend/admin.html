<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA VPN Admin</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;background:#091321;color:#eee}input,textarea,button{box-sizing:border-box;width:100%;margin:.35rem 0;padding:.7rem;border-radius:8px;border:1px solid #456;background:#101a2b;color:#fff}textarea{min-height:120px}button{background:#1677ee;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.server{padding:1rem;margin:.5rem 0;background:#101a2b;border-radius:10px}small{color:#aaa}#message{white-space:pre-wrap;color:#35d0ba}</style>
<h1>NOVA VPN · مدیریت</h1><p><small>از HTTPS استفاده کنید. کانفیگ‌ها در مرورگر اپراتور و دستگاه کلاینت قابل دسترسی‌اند؛ آن‌ها را عمومی یا در لاگ‌ها منتشر نکنید.</small></p>
<section><h2>ورود مدیر</h2><input id="password" type="password" placeholder="رمز مدیر از environment backend"><button onclick="login()">ورود</button></section>
<section id="panel" hidden><h2>افزودن / جایگزینی سرور</h2><div class="row"><input id="id" placeholder="id (مثال: eu-1)"><input id="name" placeholder="نام نمایشی"><input id="country" maxlength="2" placeholder="کد کشور معتبر (مثال DE)"><input id="protocol" placeholder="پروتکل (VLESS/VMESS/TROJAN/SS)"></div><textarea id="config" placeholder="کانفیگ خام (فقط مدیر)"></textarea><label><input id="enabled" type="checkbox" style="width:auto"> فعال‌سازی پس از آزمایش مستقل</label><input id="order" type="number" value="0" placeholder="ترتیب"><button onclick="save()">ذخیره / ویرایش</button><button onclick="refresh()">بارگذاری مجدد فهرست</button><div id="servers"></div></section><p id="message"></p>
<script>
let token='';const msg=s=>document.querySelector('#message').textContent=s;
async function request(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text())||r.status);return r.status===204?null:r.json()}
async function login(){try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(!r.ok)throw Error(await r.text());token=(await r.json()).access_token;document.querySelector('#panel').hidden=false;await refresh();msg('ورود موفق.')}catch(e){msg('خطا: '+e.message)}}
async function refresh(){try{const rows=await request('/admin/servers');document.querySelector('#servers').innerHTML=rows.map(s=>`<div class="server"><b>${esc(s.name)}</b> · ${esc(s.country_code||'نامشخص')} · ${esc(s.protocol)} · ${s.enabled?'فعال':'غیرفعال'}<br><small>${esc(s.id)}</small><button onclick="edit('${esc(s.id)}')">ویرایش</button><button onclick="removeServer('${esc(s.id)}')">حذف</button></div>`).join('')||'سروری ثبت نشده';window.serverRows=rows;}catch(e){msg('خطا: '+e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function edit(id){const s=window.serverRows.find(x=>x.id===id);if(!s)return;for(const [k,v] of Object.entries({id:s.id,name:s.name,country:s.country_code,protocol:s.protocol,order:s.sort_order}))document.querySelector('#'+k).value=v;document.querySelector('#enabled').checked=!!s.enabled;document.querySelector('#config').value='برای جلوگیری از دریافت مجدد، کانفیگ جایگزین را وارد کنید.';document.querySelector('#config').focus()}
async function save(){try{const id=document.querySelector('#id').value.trim(), raw=document.querySelector('#config').value;if(raw.startsWith('برای جلوگیری'))throw Error('کانفیگ جدید را وارد کنید.');const body={id,name:document.querySelector('#name').value.trim(),country_code:document.querySelector('#country').value.trim().toUpperCase(),protocol:document.querySelector('#protocol').value.trim().toUpperCase(),config:raw,enabled:document.querySelector('#enabled').checked,sort_order:Number(document.querySelector('#order').value)||0};let exists=window.serverRows.some(s=>s.id===id);await request(exists?'/admin/servers/'+encodeURIComponent(id):'/admin/servers',exists?'PUT':'POST',body);msg('ذخیره شد. وضعیت و اتصال سرور را پیش از فعال کردن بررسی کنید.');await refresh()}catch(e){msg('خطا: '+e.message)}}
async function removeServer(id){if(!confirm('حذف این سرور؟'))return;try{await request('/admin/servers/'+encodeURIComponent(id),'DELETE');await refresh();msg('سرور حذف شد.')}catch(e){msg('خطا: '+e.message)}}
</script></html>
